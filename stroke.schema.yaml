schema:
  schema_id: stroke
  name: 五筆畫
  version: '0.6'
  author:
  - 四季的風
  - 雪齋
  - Kunki Chou
  - 宋天
  description: '五筆畫

    h,s,p,n,z 代表橫、豎、撇、捺、折

    '
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - 西文
- name: full_shape
  states:
  - 半角
  - 全角
- name: ascii_punct
  states:
  - 。，
  - ．，
engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - table_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: ' '''
menu:
  page_size: 9
translator:
  dictionary: stroke
  preedit_format:
  - xlit/hspnz/⼀⼁⼃⼂⼄/
  comment_format:
  - xform/~//
  - xlit/hspnz/⼀⼁⼃⼂⼄/
abc_segmentor:
  extra_tags: []
punctuator:
  import_preset: default
key_binder:
  import_preset: default
  bindings:
  - when: always
    accept: d
    send: n
  - when: always
    accept: t
    send: h
  - when: always
    accept: j
    send: h
  - when: always
    accept: k
    send: s
  - when: always
    accept: l
    send: p
  - when: always
    accept: u
    send: n
  - when: always
    accept: i
    send: z
  - when: always
    accept: KP_1
    send: h
  - when: always
    accept: KP_2
    send: s
  - when: always
    accept: KP_3
    send: p
  - when: always
    accept: KP_4
    send: n
  - when: always
    accept: KP_5
    send: z
  - when: has_menu
    accept: KP_6
    send: Select
  - when: has_menu
    accept: KP_7
    send: Select
  - when: has_menu
    accept: KP_8
    send: Select
  - when: has_menu
    accept: KP_9
    send: Select
  - when: has_menu
    accept: KP_0
    send: Select
recognizer:
  import_preset: default
  patterns: {}
